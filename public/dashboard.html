<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affiliate Dashboard — Mindful Break</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

<nav class="topnav">
  <div class="wrap">
    <a href="/" class="brand"><span class="dot"></span> Mindful Break Affiliates</a>
    <div class="navlinks"><a href="#" id="logout-link">Log out</a></div>
  </div>
</nav>

<div class="wrap">
  <div class="dash-header">
    <div>
      <h2 style="text-align:left; margin:0;">Your dashboard</h2>
      <div style="color:var(--muted); font-size:14px; margin-top:6px;">Last 180 days of activity</div>
    </div>
  </div>

  <div class="referral-box">
    <div>
      <div style="font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;">Your referral code</div>
      <div class="referral-code" id="referral-code">—</div>
    </div>
    <div class="copy-link-box">
      <input type="text" id="referral-link" readonly>
      <button class="btn btn-outline" id="copy-link-btn">Copy link</button>
    </div>
  </div>

  <div id="payout-banner" class="payout-banner pending">
    <div>
      <div style="font-weight:700;" id="payout-headline">Loading...</div>
      <div style="font-size:13px; color:var(--muted);" id="payout-sub"></div>
    </div>
    <div style="font-size:13px; color:var(--muted);">Next settlement: <strong id="next-settlement" style="color:var(--text);">—</strong></div>
  </div>

  <div class="dash-grid">
    <div class="dash-card"><div class="v" id="stat-installs">—</div><div class="l">Installs via your link</div></div>
    <div class="dash-card"><div class="v" id="stat-sessions">—</div><div class="l">Sessions started</div></div>
    <div class="dash-card"><div class="v" id="stat-failed">—</div><div class="l">Failed / incomplete sessions</div></div>
    <div class="dash-card"><div class="v" id="stat-unlocks">—</div><div class="l">Paid unlocks</div></div>
  </div>

  <div class="dash-grid" style="grid-template-columns: repeat(2, 1fr);">
    <div class="dash-card"><div class="v" style="color:var(--primary);" id="stat-earnings">—</div><div class="l">Total earnings (lifetime)</div></div>
    <div class="dash-card"><div class="v" id="stat-pending">—</div><div class="l">Pending (not yet paid out)</div></div>
  </div>

  <div class="card" style="margin-bottom: 60px;">
    <h3 style="margin-top:0;">Earnings over time</h3>
    <canvas id="earnings-chart" height="90"></canvas>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  requireAuthOrRedirect();
  document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); logout(); });
  document.getElementById("copy-link-btn").addEventListener("click", () => {
    const input = document.getElementById("referral-link");
    input.select();
    navigator.clipboard?.writeText(input.value);
    const btn = document.getElementById("copy-link-btn");
    const original = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => (btn.textContent = original), 1500);
  });

  function fmtMoney(n, currency) {
    return `${currency === "INR" ? "\u20b9" : currency + " "}${Math.round(n).toLocaleString("en-IN")}`;
  }

  (async function load() {
    try {
      const d = await apiFetch("/affiliate/dashboard");

      document.getElementById("referral-code").textContent = d.referralCode;
      document.getElementById("referral-link").value =
        `https://play.google.com/store/apps/details?id=com.arpitagrawal.digitaldetox&referrer=${d.referralCode}`;

      document.getElementById("stat-installs").textContent = d.installs.toLocaleString("en-IN");
      document.getElementById("stat-sessions").textContent = d.sessionsStarted.toLocaleString("en-IN");
      document.getElementById("stat-failed").textContent = d.failedSessions.toLocaleString("en-IN");
      document.getElementById("stat-unlocks").textContent = d.paidUnlocks.toLocaleString("en-IN");
      document.getElementById("stat-earnings").textContent = fmtMoney(d.totalEarningsINR, "INR");
      document.getElementById("stat-pending").textContent = fmtMoney(d.pendingINR, "INR");
      document.getElementById("next-settlement").textContent = d.nextSettlementDate;

      const banner = document.getElementById("payout-banner");
      const headline = document.getElementById("payout-headline");
      const sub = document.getElementById("payout-sub");
      if (d.eligibleForPayout) {
        banner.className = "payout-banner eligible";
        headline.textContent = `You're eligible for payout -- ${fmtMoney(d.pendingINR, "INR")} pending`;
        sub.textContent = `You've crossed the ${d.payoutThresholdDisplay} payout threshold. Paid out monthly, manually.`;
      } else {
        banner.className = "payout-banner pending";
        const remaining = Math.max(0, 1000 - d.pendingINR);
        headline.textContent = `${fmtMoney(d.pendingINR, "INR")} pending -- ${fmtMoney(remaining, "INR")} to go`;
        sub.textContent = `Payout threshold is ${d.payoutThresholdDisplay}. Keep sharing your link!`;
      }

      const last30 = d.revenueByDay.slice(-30);
      new Chart(document.getElementById("earnings-chart"), {
        type: "bar",
        data: {
          labels: last30.map((r) => r.date.slice(5)),
          datasets: [
            {
              label: "Daily commission (INR)",
              data: last30.map((r) => r.commissionINR),
              backgroundColor: "#00c896",
              borderRadius: 4,
            },
          ],
        },
        options: {
          scales: {
            x: { ticks: { color: "#8b99ab" }, grid: { display: false } },
            y: { ticks: { color: "#8b99ab" }, grid: { color: "#232b36" } },
          },
          plugins: { legend: { display: false } },
        },
      });
    } catch (err) {
      if (err.message?.toLowerCase().includes("not authenticated")) {
        logout();
      } else {
        document.querySelector(".wrap").insertAdjacentHTML(
          "afterbegin",
          `<div class="card" style="margin-bottom:20px; border-color:var(--danger);"><p style="color:var(--danger);">Couldn't load your dashboard: ${err.message}</p></div>`
        );
      }
    }
  })();
</script>
</body>
</html>
