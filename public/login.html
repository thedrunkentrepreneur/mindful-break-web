<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affiliate Login — Mindful Break</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="topnav">
  <div class="wrap">
    <a href="/" class="brand"><span class="dot"></span> Mindful Break Affiliates</a>
    <div class="navlinks"><a href="/signup.html">New here? Become an affiliate</a></div>
  </div>
</nav>

<div class="form-card">
  <h2>Welcome back</h2>
  <div class="form-sub">Log in to see your referral stats and earnings.</div>

  <form id="login-form">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" required placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" required placeholder="Your password">
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
    <div class="form-msg" id="form-msg"></div>
  </form>
  <div class="form-footer-link">New here? <a href="/signup.html">Become an affiliate</a></div>
</div>

<script src="/js/app.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("form-msg");
    const btn = document.getElementById("submit-btn");
    msg.textContent = "";
    msg.className = "form-msg";
    btn.disabled = true;
    btn.textContent = "Logging in...";
    try {
      const data = await apiFetch("/affiliate/login", {
        method: "POST",
        body: JSON.stringify({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      setAuthToken(data.token);
      window.location.href = "/dashboard.html";
    } catch (err) {
      msg.textContent = err.message;
      msg.className = "form-msg error";
      btn.disabled = false;
      btn.textContent = "Log in";
    }
  });
</script>
</body>
</html>
